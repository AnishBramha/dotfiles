# ==========================================================================
# ~/.config/hypr/hyprlock.conf
# WINDOWS VISTA LOGIN THEME - AS CLOSE AS POSSIBLE
# ==========================================================================

background {
    monitor =
    path = /home/anish/Pictures/Library/Vista_Ultimate_2.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
}

# 1. The Complex Beveled Glass Frame Well
# A slightly darker, shadowed area set into the wallpaper well.
label {
    monitor =
    text = 
    color = rgba(0, 0, 0, 0)
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.4)
    size = 140, 140
    border_size = 0
    rounding = 14
    position = 0, 120
    halign = center
    valign = center
}

# 2. The Main User Tile (Daisy Image)
# This element holds the daisy and provides the main glossy, reflective look.
# 2. The Main User Tile (Aero Glass Frame)
image {
    monitor =
    path = /home/anish/Pictures/Library/Windows_7_Daisy.png
    size = 120

    # 1. Thicker border to match the heavy glass rim of Windows 7
    border_size = 8

    # 2. THE GLASS EFFECT (Gradient Border)
    # Starts with a harsh white glare at the top-left (135deg),
    # fades into a translucent Aero cyan in the middle,
    # and deepens into a darker blue-grey shadow at the bottom right.
    border_color = rgba(240, 250, 255, 0.45) rgba(200, 220, 230, 0.1) rgba(25, 45, 60, 0.35) 120deg

    # 3. Vista/7 profiles have a slightly more pronounced, softer curve
    rounding = 7

    position = 0, 120
    halign = center
    valign = center

    # 4. Sharper, multi-pass drop shadow to separate the glass from the background well
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.65)
}

# 3. Username Text (White with shadow)
label {
    monitor =
    text = Anish Bramha # Your name
    color = rgb(255, 255, 255)
    font_size = 24
    font_family = SF Pro Display Semibold
    
    # Position below the frame well
    position = 0, 20
    halign = center
    valign = center
    
    # Deeper, sharper shadow for maximum contrast
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# 4. Rectangular Password Input Field (Grey border, sharp corners)
# We make it wider and style the inner color to look like the input box.
# 4. Refined Aero Password Input Field
input-field {
    monitor =
    # Making the box slightly taller gives the text room to scale up
    size = 200, 25

    # Windows 7 borders are slightly thicker and not 100% sharp
    outline_thickness = 2
    rounding = 3

    # Larger dots for the actual typed password
    dots_size = 0.4
    dots_spacing = 0.25
    dots_center = false
    fade_on_empty = false

    # Use Pango markup to force larger text and a softer grey color
    placeholder_text = <span size="14pt" foreground="##7a7a7a">Password</span>
    fail_text = <span size="14pt" foreground="##ff0000">Incorrect Password</span>
    check_text = <span size="14pt" foreground="##7a7a7a">Logging In</span>

    # Soft metallic blue-grey border
    outer_color = rgb(171, 193, 222)
    inner_color = rgb(255, 255, 255)
    font_color = rgb(0, 0, 0)

    # The Aero Focus Glow: A cyan/blue drop shadow that simulates light emission
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(82, 153, 235, 0.65)

    # Position below the username, offset left for the arrow
    position = 0, -50
    halign = center
    valign = center
}

# 5. The Blue Orb Submission Button (Image Element)
# Placing your glossy blue arrow PNG
image {
    monitor =
    path = /home/anish/.icons/Windows-7/actions/forward.png # Use your arrow PNG
    size = 36 # Matching the height of the password field
    border_size = 0
    rounding = 99 # Circular image asset
    
    # Position right next to the password input field
    position = 130, -50
    halign = center
    valign = center
    
    # Add a slight shadow and bloom to enhance the gloss
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(62, 142, 214, 0.4) # Blue glowing accent

    onclick = "wtype -k Return"
}

# ==========================================================================
# BOTTOM LEFT CLOCK & DATE
# ==========================================================================

# 1. The Time (Large)
label {
    monitor =
    # update:1000 refreshes the command every 1000ms (1 second)
    # %I:%M %p formats it as 12-hour (e.g., 12:26 PM). Use %H:%M for 24-hour.
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgb(255, 255, 255)
    font_size = 36
    font_family = SF Pro Display Semibold

    # Anchored to the bottom left
    halign = left
    valign = bottom

    # 30px from the left edge, 80px from the bottom to leave room for the date
    position = 40, 85

    # Shadows for readability against bright wallpapers
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# 2. The Date & Day (Smaller)
label {
    monitor =
    # update:60000 refreshes every 60 seconds (no need to refresh date every second)
    # %A = Day, %B = Month, %d = Day of month, %Y = Year (e.g., Sunday, July 05, 2026)
    text = cmd[update:60000] echo "$(date +'%A  •  %B %d, %Y')"
    color = rgba(240, 240, 240, 0.9)
    font_size = 20
    font_family = SF Pro Display

    halign = left
    valign = bottom

    # 30px from the left, 30px from the bottom (padding from the absolute corner)
    position = 40, 40

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ==========================================================================
# BOTTOM RIGHT POWER CONTROLS
# ==========================================================================

# 1. Sleep Button (Left)
image {
    monitor =
    path = /home/anish/.icons/Windows-7/actions/suspend.png
    size = 35
    border_size = 0
    rounding = 0

    halign = right
    valign = bottom

    # 140px from right edge, 40px from bottom
    position = -140, 40

    # Void Linux command to suspend to RAM
    onclick = loginctl suspend

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(25, 75, 155, 0.6)
}

# 2. Restart Button (Middle)
image {
    monitor =
    path = /home/anish/.icons/Windows-7/actions/reload.png
    size = 35
    border_size = 0
    rounding = 0

    halign = right
    valign = bottom

    # 90px from right edge (50px spacing from the Sleep button)
    position = -90, 40

    # Void Linux command to reboot
    onclick = loginctl reboot

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(50, 185, 75, 0.6)
}

# 3. Power Off Button (Right)
image {
    monitor =
    path = /home/anish/.icons/Windows-7/actions/boot.png
    size = 35
    border_size = 0
    rounding = 0

    halign = right
    valign = bottom

    # 40px from right edge (50px spacing from the Restart button)
    position = -40, 40

    # Void Linux command to shut down
    onclick = loginctl poweroff

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(215, 60, 50, 0.6)
}





